name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android folder if missing
        run: flutter create --platforms=android --project-name needlink2 --org com.needlink .

      - name: Get dependencies
        run: flutter pub get

      - name: Patch old video_thumbnail for jcenter
        run: |
          find $HOME/.pub-cache/hosted -path "*video_thumbnail*" -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
