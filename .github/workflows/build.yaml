name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Find pubspec.yaml
        run: |
          # গিটহাবকে বলে দিচ্ছি যেখানে pubspec.yaml আছে সেখানে যেতে
          echo "Searching for pubspec.yaml..."
          find . -name "pubspec.yaml" -exec dirname {} \;

      - name: Get dependencies
        run: |
          # যেখানে pubspec.yaml আছে সেখানে গিয়ে pub get চালাবে
          cd $(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          flutter pub get
          
      - name: Build APK
        run: |
          # একই ফোল্ডারে গিয়ে বিল্ড করবে
          cd $(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          # খুঁজে বের করে APK ফাইলটা আপলোড করবে
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
