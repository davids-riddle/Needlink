name: needlink2
description: Need Link - একটি রিভার্স মার্কেটপ্লেস অ্যাপ।
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  image_picker: ^1.1.2
  http: ^1.2.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_full.png
    - assets/logo_spin.png
